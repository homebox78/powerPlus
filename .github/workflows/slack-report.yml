# main 푸시 시 해커톤 Slack 채널(#21-개발하는디자이너)에 간략 주간보고 형식으로 자동 공유.
# - 웹훅 URL은 repo Secrets 의 SLACK_WEBHOOK_URL (공개 repo 라 소스에 절대 넣지 않는다)
# - 시크릿 미설정이면 조용히 건너뜀(빌드 실패 X)
# - 알리고 싶지 않은 커밋은 메시지에 [skip-slack] 포함
name: Slack 진행 보고

on:
  push:
    branches: [main]
  # 사람이 읽을 요약 보고를 직접 보낼 때(커밋 불릿 대신 작성한 문구 그대로 전송)
  workflow_dispatch:
    inputs:
      message:
        description: "Slack에 보낼 보고 본문(비우면 안내만)"
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-slack]') }}
    steps:
      - name: 수동 보고 전송
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          MSG: ${{ inputs.message }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀"; exit 0
          fi
          TEXT=$(jq -n --arg m "$MSG" '{"text": $m}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$TEXT" "$WEBHOOK" \
            && echo "Slack 전송 완료" || echo "Slack 전송 실패"

      - name: Slack으로 업데이트 요약 전송
        if: ${{ github.event_name == 'push' }}
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀"; exit 0
          fi
          # 커밋 제목(첫 줄)만 모아 불릿으로 — 주간보고의 '한 일' 형식
          BULLETS=$(jq -r '.commits[] | "• " + (.message | split("\n")[0])' "$GITHUB_EVENT_PATH" | head -10)
          COUNT=$(jq -r '.commits | length' "$GITHUB_EVENT_PATH")
          DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          TEXT=$(jq -n \
            --arg d "$DATE" \
            --arg b "$BULLETS" \
            --arg n "$COUNT" \
            --arg u "$COMPARE_URL" \
            '{"text": ("📌 *[21 개발하는디자이너] powerPlus 진행 업데이트* — " + $d + "\n*한 일* (커밋 " + $n + "건)\n" + $b + "\n🔗 변경 내역: " + $u)}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$TEXT" "$WEBHOOK" \
            && echo "Slack 전송 완료" || echo "Slack 전송 실패(무시)"
