<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>powerPlus 관리자</title>
  <style>
    :root {
      --bg: #f8fafc; --surface: #fff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --accent: #2563eb; --accent-soft: #eff6ff; --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; font-size: 14px;
    }
    .hidden { display: none !important; }
    button { font: inherit; cursor: pointer; }
    input, select, textarea {
      font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; outline: none; background: var(--surface);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
    .btn--ghost { background: var(--surface); color: var(--accent); }
    .btn--danger { background: var(--surface); color: var(--danger); border-color: var(--border); }
    .btn:disabled { opacity: .5; cursor: default; }

    /* 로그인 */
    .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login__card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(15,23,42,.06); }
    .login__title { margin: 0; text-align: center; color: var(--accent); font-size: 22px; }
    .login__sub { margin: 4px 0 18px; text-align: center; color: var(--muted); font-size: 13px; }
    .field { margin-bottom: 10px; }
    .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .msg { margin-top: 10px; font-size: 12px; text-align: center; }
    .msg--err { color: var(--danger); }
    .msg--ok { color: var(--accent); }

    /* 메인 */
    .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .topbar h1 { font-size: 18px; margin: 0; }
    .topbar__user { font-size: 12px; color: var(--muted); margin-right: 8px; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; color: var(--muted); background: #f1f5f9; }
    tr:last-child td { border-bottom: none; }
    .thumb { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .thumb svg { width: 100%; height: 100%; }
    .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-size: 11px; margin: 1px; }
    .row-actions { white-space: nowrap; display: flex; gap: 6px; }
    .row-actions button { padding: 4px 10px; border-radius: 6px; font-size: 12px; }

    /* 폼(모달) */
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal__card { width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 12px; padding: 20px; }
    .modal__title { margin: 0 0 14px; font-size: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    textarea { min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
    .preview { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
    .preview__box { width: 80px; height: 80px; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .preview__box svg { width: 100%; height: 100%; }
    .modal__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <!-- 로그인 -->
  <div id="login" class="login">
    <div class="login__card">
      <h1 class="login__title">powerPlus 관리자</h1>
      <p class="login__sub">자산 라이브러리 관리</p>
      <div id="step-email">
        <div class="field">
          <label for="email">회사 이메일</label>
          <input id="email" type="email" placeholder="name@solideos.com" autocomplete="email" />
        </div>
        <button id="btn-request" class="btn" style="width:100%">인증코드 받기</button>
      </div>
      <div id="step-code" class="hidden">
        <div class="field">
          <label for="code">인증코드 (<span id="code-email"></span>)</label>
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" />
        </div>
        <button id="btn-verify" class="btn" style="width:100%">로그인</button>
      </div>
      <div id="login-msg" class="msg"></div>
    </div>
  </div>

  <!-- 메인 -->
  <div id="main" class="wrap hidden">
    <div class="topbar">
      <h1>자산 관리</h1>
      <div>
        <span class="topbar__user" id="who"></span>
        <button id="btn-new" class="btn">+ 새 자산</button>
        <button id="btn-logout" class="btn btn--ghost">로그아웃</button>
      </div>
    </div>
    <div id="list-msg" class="msg"></div>
    <table>
      <thead>
        <tr><th>미리보기</th><th>ID</th><th>이름</th><th>카테고리</th><th>태그</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- 폼 모달 -->
  <div id="modal" class="modal hidden">
    <div class="modal__card">
      <h2 class="modal__title" id="modal-title">새 자산</h2>
      <div class="form-grid">
        <div class="field">
          <label for="f-id">ID</label>
          <input id="f-id" placeholder="ic-heart" />
        </div>
        <div class="field">
          <label for="f-category">카테고리</label>
          <select id="f-category">
            <option value="icon">아이콘 (icon)</option>
            <option value="photo">사진 (photo)</option>
            <option value="illust">일러스트 (illust)</option>
            <option value="diagram">다이어그램 (diagram)</option>
          </select>
        </div>
        <div class="field full">
          <label for="f-name">이름</label>
          <input id="f-name" placeholder="하트" />
        </div>
        <div class="field full">
          <label for="f-tags">태그 (콤마로 구분)</label>
          <input id="f-tags" placeholder="하트, 좋아요, 사랑" />
        </div>
        <div class="field full">
          <label for="f-svg">SVG 코드</label>
          <textarea id="f-svg" placeholder="&lt;svg ...&gt;...&lt;/svg&gt;"></textarea>
        </div>
        <div class="preview">
          <span style="font-size:12px;color:var(--muted)">미리보기</span>
          <div class="preview__box" id="f-preview"></div>
        </div>
      </div>
      <div id="modal-msg" class="msg msg--err"></div>
      <div class="modal__actions">
        <button id="btn-cancel" class="btn btn--ghost">취소</button>
        <button id="btn-save" class="btn">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 운영(서버에 같이 배포)에서는 상대경로, 로컬 데모에서는 배포 서버 절대경로.
    const API_BASE = location.hostname === "hom2box.com" ? "../api" : "https://hom2box.com/powerPlus/api";
    const TOKEN_KEY = "pp_admin_token";
    const $ = (id) => document.getElementById(id);
    let editingId = null;

    function token() { return localStorage.getItem(TOKEN_KEY); }
    function authHeaders() { return token() ? { Authorization: "Bearer " + token() } : {}; }

    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: { "Content-Type": "application/json", ...authHeaders(), ...(opts.headers || {}) },
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ("오류 " + res.status));
      return body;
    }

    // ── 로그인 ──
    $("btn-request").onclick = async () => {
      const email = $("email").value.trim();
      setMsg("login-msg", "");
      try {
        await api("/auth/request", { method: "POST", body: JSON.stringify({ email }) });
        $("step-email").classList.add("hidden");
        $("step-code").classList.remove("hidden");
        $("code-email").textContent = email;
        setMsg("login-msg", "인증코드를 이메일로 보냈습니다.", "ok");
      } catch (e) { setMsg("login-msg", e.message, "err"); }
    };

    $("btn-verify").onclick = async () => {
      const email = $("email").value.trim();
      const code = $("code").value.trim();
      setMsg("login-msg", "");
      try {
        const r = await api("/auth/verify", { method: "POST", body: JSON.stringify({ email, code }) });
        localStorage.setItem(TOKEN_KEY, r.token);
        await enterAdmin();
      } catch (e) { setMsg("login-msg", e.message, "err"); }
    };

    $("btn-logout").onclick = async () => {
      try { await api("/auth/logout", { method: "POST" }); } catch {}
      localStorage.removeItem(TOKEN_KEY);
      location.reload();
    };

    async function enterAdmin() {
      // 관리자 권한 확인
      let me;
      try { me = await api("/auth/me"); }
      catch { localStorage.removeItem(TOKEN_KEY); return; }
      if (!me.isAdmin) {
        setMsg("login-msg", "관리자 권한이 없는 계정입니다.", "err");
        localStorage.removeItem(TOKEN_KEY);
        return;
      }
      $("login").classList.add("hidden");
      $("main").classList.remove("hidden");
      $("who").textContent = me.email;
      await loadAssets();
    }

    // ── 목록 ──
    async function loadAssets() {
      setMsg("list-msg", "불러오는 중…");
      try {
        const r = await api("/assets?limit=500");
        renderRows(r.data || []);
        setMsg("list-msg", "");
      } catch (e) { setMsg("list-msg", e.message, "err"); }
    }

    function renderRows(assets) {
      const cat = { icon: "아이콘", photo: "사진", illust: "일러스트", diagram: "다이어그램" };
      $("rows").innerHTML = assets.map((a) => `
        <tr>
          <td><div class="thumb">${a.svg}</div></td>
          <td><code>${esc(a.id)}</code></td>
          <td>${esc(a.name)}</td>
          <td>${cat[a.category] || esc(a.category)}</td>
          <td>${(a.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</td>
          <td><div class="row-actions">
            <button class="btn btn--ghost" data-edit="${esc(a.id)}">수정</button>
            <button class="btn btn--danger" data-del="${esc(a.id)}">삭제</button>
          </div></td>
        </tr>`).join("");
      $("rows").querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => openEdit(assets.find((x) => x.id === b.dataset.edit)));
      $("rows").querySelectorAll("[data-del]").forEach((b) => b.onclick = () => removeAsset(b.dataset.del));
    }

    // ── 폼 ──
    $("btn-new").onclick = () => openForm(null);
    $("btn-cancel").onclick = () => $("modal").classList.add("hidden");
    $("f-svg").oninput = () => { $("f-preview").innerHTML = $("f-svg").value; };

    function openForm(asset) {
      editingId = asset ? asset.id : null;
      $("modal-title").textContent = asset ? "자산 수정" : "새 자산";
      $("f-id").value = asset ? asset.id : "";
      $("f-id").disabled = !!asset;
      $("f-name").value = asset ? asset.name : "";
      $("f-category").value = asset ? asset.category : "icon";
      $("f-tags").value = asset ? (asset.tags || []).join(", ") : "";
      $("f-svg").value = asset ? asset.svg : "";
      $("f-preview").innerHTML = asset ? asset.svg : "";
      setMsg("modal-msg", "");
      $("modal").classList.remove("hidden");
    }
    const openEdit = openForm;

    $("btn-save").onclick = async () => {
      const payload = {
        id: $("f-id").value.trim(),
        name: $("f-name").value.trim(),
        category: $("f-category").value,
        tags: $("f-tags").value,
        svg: $("f-svg").value.trim(),
      };
      setMsg("modal-msg", "");
      try {
        if (editingId) await api("/admin/assets/" + encodeURIComponent(editingId), { method: "PUT", body: JSON.stringify(payload) });
        else await api("/admin/assets", { method: "POST", body: JSON.stringify(payload) });
        $("modal").classList.add("hidden");
        await loadAssets();
      } catch (e) { setMsg("modal-msg", e.message, "err"); }
    };

    async function removeAsset(id) {
      if (!confirm(`'${id}' 자산을 삭제할까요?`)) return;
      try { await api("/admin/assets/" + encodeURIComponent(id), { method: "DELETE" }); await loadAssets(); }
      catch (e) { setMsg("list-msg", e.message, "err"); }
    }

    function setMsg(id, text, kind) {
      const el = $(id);
      el.textContent = text || "";
      el.className = "msg" + (kind === "err" ? " msg--err" : kind === "ok" ? " msg--ok" : "");
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    // 토큰 있으면 바로 관리자 진입 시도
    if (token()) enterAdmin();
  </script>
</body>
</html>
